<!DOCTYPE html>
<html lang="en">
<head>
<script id="rakaza-input-kit" src="./rakaza-input.js"></script>
<script src="./rakaza-content.js?v=16"></script>
<script src="./rakaza-sim.js?v=16"></script>
<script src="./rakaza-replay.js?v=16"></script>
<script src="./rakaza-adapter.js?v=16"></script>
<script src="./rakaza-char.js?v=16"></script>
<script src="./rakaza-art.js?v=16"></script>
<script src="./rakaza-fx.js?v=16"></script>
<script src="./rakaza-audio.js?v=16"></script>
<link rel="stylesheet" href="./rakaza-v14.css?v=16">
<link rel="stylesheet" href="./rakaza-v15.css?v=16">
<link rel="stylesheet" href="./rakaza-mobile.css?v=17">
<script src="./rakaza-mobile.js?v=17" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08090b">
    <title>Ride 'Em, Rakaza!</title>
    <meta name="description" content="Ride 'Em, Rakaza! — a neon rooftop endless runner. Daily seed, ghost runs, six modes.">
    <style>
        :root {
            color-scheme: dark;
            --gold: #d9b26a;
            --purple: #a855f7;
            --cyan: #22d3ee;
            --danger: #f43f5e;
            --safe-top: 59px;
            --safe-bottom: 34px;
            --safe-side: 16px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #08090b;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
            color: #f8f8fc;
            font-variant-numeric: tabular-nums;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas#world {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
        }

        button {
            appearance: none;
            border: 1px solid #ffffff20;
            border-radius: 12px;
            padding: 13px 16px;
            color: #f8f8fc;
            background: #14151de8;
            font: inherit;
            font-size: 12px;
            font-weight: 750;
            letter-spacing: 1.1px;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 44px;
            transition: border-color 120ms, background 120ms;
        }

        button:hover,
        button.selected {
            border-color: var(--cyan);
            background: #203039f2;
        }

        button:active {
            background: #34404d;
        }

        button:disabled {
            opacity: 0.35;
            cursor: default;
        }

        button.primary {
            background: var(--gold);
            color: #171318;
            border-color: #efd49c;
        }

        button.primary.selected,
        button.primary:hover {
            background: #f0ce8b;
            border-color: white;
        }

        button.purple {
            background: #a855f725;
            border-color: #a855f780;
        }

        .hidden {
            display: none !important;
        }

        #hud {
            position: fixed;
            inset: var(--safe-top) var(--safe-side) auto;
            pointer-events: none;
        }

        #hearts { display: flex; justify-content: center; gap: 6px; margin-top: 6px; font-size: 26px; line-height: 1; text-shadow: 0 2px 12px #000; }
        #hearts .hrt { color: #ff4d6d; transition: transform .15s, opacity .25s, filter .25s; }
        #hearts .hrt.lost { color: #5b5470; opacity: .45; transform: scale(.82); filter: grayscale(1); }
        #hearts .hrt.pulse { animation: hrtPulse .5s ease-out; }
        #hearts.inv { animation: hrtInv .35s linear infinite alternate; }
        #hearts.zen::after { content: 'ZEN · PRACTICE'; font-size: 11px; letter-spacing: .14em; color: #b8afc8; align-self: center; margin-left: 6px; }
        @keyframes hrtPulse { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
        @keyframes hrtInv { from { opacity: 1; } to { opacity: .55; } }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 64px;
            text-shadow: 0 2px 12px #000;
        }

        .score-block {
            min-width: 80px;
        }

        .score-block.right {
            text-align: right;
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 2px;
            color: #c6bed2;
            font-weight: 700;
        }

        .big-number {
            font-size: 30px;
            font-weight: 850;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .big-number small {
            font-size: 12px;
            color: #b8b3c9;
            margin-left: 4px;
            letter-spacing: 0;
        }

        .gold {
            color: var(--gold);
        }

        .cyan {
            color: var(--cyan);
        }

        #combo {
            min-height: 16px;
            font-size: 11px;
            margin-top: 3px;
            color: var(--gold);
        }

        .tools {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 8px;
            pointer-events: auto;
        }

        .tools button {
            padding: 7px 10px;
            min-height: 32px;
            border-radius: 8px;
            font-size: 9px;
            letter-spacing: 0.6px;
            background: #08090bc7;
        }

        #pilot-toggle {
            margin-right: auto;
        }

        #pilot-chip {
            margin-top: 8px;
            border-left: 2px solid var(--cyan);
            background: #08090bbd;
            padding: 7px 9px;
            max-width: 330px;
            font-size: 10px;
            line-height: 1.5;
            border-radius: 0 8px 8px 0;
        }

        #pilot-label {
            color: var(--cyan);
            font-weight: 800;
            letter-spacing: 0.7px;
        }

        #pilot-reason {
            color: #ccc8d7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #power-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .chip {
            font-size: 9px;
            font-weight: 750;
            background: #10101bd9;
            color: #dbb7ff;
            border: 1px solid #a855f754;
            border-radius: 6px;
            padding: 5px 7px;
        }

        #screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--safe-top) + 8px) var(--safe-side) calc(var(--safe-bottom) + 8px);
            background: linear-gradient(180deg, #08090b45, #08090b70 30%, #08090bf0);
        }

        #panel {
            width: 100%;
            max-width: 460px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 5px;
            color: var(--gold);
            margin-bottom: 6px;
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        h1 {
            font-size: clamp(43px, 12vw, 64px);
            line-height: 0.95;
            font-weight: 950;
            letter-spacing: -3px;
            text-shadow: 3px 3px 0 #a855f760;
        }

        h2 {
            font-size: 28px;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 12px;
            line-height: 1.65;
            color: #bcb5c8;
            margin-top: 10px;
        }

        .intro-art {
            height: clamp(40px, 10vh, 104px);
            position: relative;
            border-bottom: 1px solid #ffffff18;
        }

        .intro-art span {
            position: absolute;
            bottom: 12px;
            left: 0;
            font-size: 9px;
            letter-spacing: 2px;
            color: #d9b26a;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .wide {
            grid-column: 1 / -1;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            color: #a9a2b5;
            font-size: 10px;
            line-height: 1.6;
        }

        .footer button {
            min-height: 32px;
            padding: 6px 8px;
            font-size: 9px;
        }

        .card {
            background: #0e1013df;
            border: 1px solid #ffffff14;
            border-radius: 16px;
            padding: 16px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-value {
            font-size: 29px;
            color: var(--gold);
            font-weight: 800;
            margin-top: 4px;
        }

        .instruction {
            font-size: 12px;
            color: #c7c1d1;
            line-height: 1.7;
            margin-top: 12px;
        }

        .instruction:first-child {
            margin-top: 0;
        }

        .instruction b {
            color: white;
        }

        .skin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .skin-tile {
            position: relative;
            padding: 8px;
            min-height: 106px;
            text-align: left;
            overflow: hidden;
            letter-spacing: 0;
        }

        .skin-tile canvas {
            display: block;
            width: 100%;
            height: 58px;
        }

        .skin-name {
            font-size: 10px;
        }

        .skin-status {
            display: block;
            color: #a8a0b6;
            font-size: 9px;
            margin-top: 3px;
        }

        .skin-tile.equipped {
            border-color: var(--gold);
        }

        #curve {
            width: 100%;
            height: 120px;
            display: block;
        }

        .trainer-topline {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #aaa2b9;
            margin-bottom: 8px;
        }

        .progress {
            height: 3px;
            background: #ffffff0c;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        #progress-fill {
            background: var(--cyan);
            width: 0;
            height: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
        }

        td,
        th {
            text-align: right;
            padding: 5px 3px;
            border-bottom: 1px solid #ffffff09;
        }

        td:first-child,
        th:first-child {
            text-align: left;
        }

        th {
            font-weight: 500;
            color: #8e879e;
        }

        .genome {
            color: #8f879f;
            font-size: 9px;
            line-height: 1.7;
            margin-top: 8px;
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(var(--safe-bottom) + 112px);
            transform: translateX(-50%);
            background: #14121ff2;
            border: 1px solid #a855f76b;
            color: #eee4ff;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 11px;
            max-width: 85%;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 150ms;
        }

        @media (max-height: 690px) {
            #panel {
                gap: 10px;
            }

            .intro-art {
                height: 26px;
            }

            .subtitle {
                margin-top: 6px;
                font-size: 11px;
            }

            .skin-tile {
                min-height: 87px;
            }

            .skin-tile canvas {
                height: 40px;
            }

            #curve {
                height: 80px;
            }

            .card {
                padding: 12px;
            }

            button {
                padding: 10px 12px;
            }
        }

        @media (orientation: landscape) {
            :root {
                --safe-top: 18px;
                --safe-bottom: 21px;
                --safe-side: 59px;
            }

            #hud {
                right: 124px;
            }

            #panel {
                max-width: 640px;
                gap: 8px;
            }

            .intro-art {
                display: none;
            }

            h1 {
                font-size: 40px;
            }

            .skin-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .skin-tile {
                min-height: 82px;
            }

            .skin-tile canvas {
                height: 35px;
            }

            .instruction {
                margin-top: 5px;
            }

            #curve {
                height: 64px;
            }
        }
    </style>
</head>
<body>
    <canvas id="world" aria-label="Ride Em, Rakaza game"></canvas>

    <div id="hud" class="hidden">
        <div class="score-row">
            <div class="score-block">
                <div class="eyebrow">DISTANCE</div>
                <div class="big-number"><span id="distance">0</span><small>m</small></div>
            </div>
            <div class="score-block right">
                <div class="eyebrow gold">COINS</div>
                <div class="big-number gold" id="coins">0</div>
                <div id="combo"></div>
            </div>
        </div>
        <div id="hearts" role="img" aria-label="Hearts left: 3 of 3"></div>
        <div class="tools">
            <button id="pilot-toggle" type="button">AI PILOT · OFF</button>
            <button id="mute-toggle" type="button">SOUND ON</button>
            <button id="fx-toggle" type="button">FX HIGH</button>
            <button id="pause-toggle" type="button" aria-label="Pause">II PAUSE</button>
        </div>
        <div id="power-chips"></div>
        <div id="ghost-chip" class="hidden"></div>
        <div id="pilot-chip" class="hidden">
            <div id="pilot-label">WAIT · LOCAL</div>
            <div id="pilot-reason">Reading the roof ahead.</div>
        </div>
    </div>

    <div id="screen">
        <main id="panel"></main>
    </div>
    <div id="toast"></div>
    <div id="rz-tip" class="hidden"></div>

    <script>
        (() => {
            'use strict';

            const canvas = document.getElementById('world');
            const ctx = canvas.getContext('2d', { alpha: false });
            const screen = document.getElementById('screen');
            const panel = document.getElementById('panel');
            const hud = document.getElementById('hud');
            const inputKit = window.RakazaInput;
            const $ = (id) => document.getElementById(id);
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
            const lerp = (a, b, t) => a + (b - a) * t;
            const smooth = (a, b, v) => {
                const t = clamp((v - a) / (b - a), 0, 1);
                return t * t * (3 - 2 * t);
            };

            if (inputKit) {
                inputKit.configure({
                    move: false,
                    look: false,
                    buttons: {
                        a: 'Jump',
                        b: 'Slide'
                    },
                    pause: true,
                    moveArea: {
                        width: 0.26,
                        height: 0.28
                    }
                });
                inputKit.showControls(false);
            }

            const skins = [
                { name: 'Violet Classic', cost: 0, body: '#a855f7', dark: '#6133a6', scarf: '#f43f8f' },
                { name: 'Sunset Ember', cost: 150, body: '#f58b52', dark: '#b74b43', scarf: '#ffce73' },
                { name: 'Neon Ghost', cost: 300, body: '#c9efff', dark: '#7685bc', scarf: '#a855f7' },
                { name: 'Chrome Circuit', cost: 500, body: '#a9bacb', dark: '#56677f', scarf: '#22d3ee' },
                { name: 'Toxic Lime', cost: 800, body: '#b9ec55', dark: '#538949', scarf: '#b45bff' },
                { name: 'Midnight Gold', cost: 1200, body: '#343047', dark: '#171522', scarf: '#d9b26a' }
            ];

            let saved = {
                best: 0,
                total: 0,
                skin: 0,
                mute: false,
                low: false,
                champion: null
            };

            try {
                const data = JSON.parse(localStorage.getItem('rz_v2') || 'null');
                if (data && typeof data === 'object') {
                    saved.best = Math.max(0, Number(data.best) || 0);
                    saved.total = Math.max(0, Number(data.total) || 0);
                    saved.skin = clamp(Math.floor(Number(data.skin) || 0), 0, 5);
                    saved.mute = Boolean(data.mute);
                    saved.low = Boolean(data.low);
                    if (Array.isArray(data.champion) && data.champion.length === 4 && data.champion.every(Number.isFinite)) {
                        saved.champion = data.champion.map((v, i) => clamp(v, i < 2 ? 0.06 : 0, i < 2 ? 0.7 : 1));
                    }
                }
            } catch (error) {
                saved.best = 0;
            }

            if (saved.total < skins[saved.skin].cost) {
                saved.skin = 0;
            }

            function persist() {
                try {
                    localStorage.setItem('rz_v2', JSON.stringify(saved));
                } catch (error) {
                    return;
                }
            }

            let width = 1;
            let height = 1;
            let dpr = 1;
            let unit = 1;
            let groundY = 1;
            let playerX = 1;
            let state = 'title';
            let game = null;
            let visualTime = 0;
            let demoTravel = 0;
            let aiEnabled = false;
            let championMode = false;
            let runId = 0;
            let pendingJump = false;
            let pendingSlide = false;
            let pointerHeld = false;
            let pointerOrigin = null;
            let axisUp = false;
            let axisDown = false;
            let menuIndex = 0;
            let menuDirection = 0;
            let menuRepeat = 0;
            let menuButtons = [];
            let toastTime = 0;
            let hitStop = 0;
            let shake = 0;
            let split = 0;
            let punch = 0;
            let lastMilestone = 0;
            let particles = [];
            let trails = [];
            let trailClock = 0;
            let hudClock = 0;
            let lastResultMode = 'manual';

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, window.__rzDprCap || 2);
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                unit = Math.min(width / 420, height / 720);
                unit = Math.max(0.38, unit);
                groundY = height * 0.72;
                playerX = Math.min(width * 0.23, 135 * unit);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            window.addEventListener('resize', resize);
            resize();

            function seeded(seed) {
                let n = seed >>> 0;
                return () => {
                    n += 0x6D2B79F5;
                    let t = n;
                    t = Math.imul(t ^ (t >>> 15), t | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            function hash(n) {
                const v = Math.sin(n * 127.1 + 311.7) * 43758.5453;
                return v - Math.floor(v);
            }

            let audio = null;
            let musicClock = 0;
            let musicStep = 0;

            function unlockAudio() {
                if (window.RakazaAudio) { window.RakazaAudio.unlock(); return; }
                try {
                    if (!audio) {
                        const AudioConstructor = window.AudioContext || window.webkitAudioContext;
                        if (AudioConstructor) {
                            audio = new AudioConstructor();
                        }
                    }
                    if (audio && audio.state === 'suspended') {
                        audio.resume().catch(() => {});
                    }
                } catch (error) {
                    audio = null;
                }
            }

            function tone(freq, duration, type = 'sine', volume = 0.04, delay = 0, endFreq = 0) {
                if (!audio || saved.mute || audio.state !== 'running') {
                    return;
                }
                try {
                    const t = audio.currentTime + delay;
                    const osc = audio.createOscillator();
                    const gain = audio.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    if (endFreq > 0) {
                        osc.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
                    }
                    gain.gain.setValueAtTime(0.0001, t);
                    gain.gain.exponentialRampToValueAtTime(volume, t + 0.008);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                    osc.connect(gain);
                    gain.connect(audio.destination);
                    osc.start(t);
                    osc.stop(t + duration + 0.02);
                    osc.onended = () => {
                        osc.disconnect();
                        gain.disconnect();
                    };
                } catch (error) {
                    return;
                }
            }

            function sound(kind) {
                if (window.RakazaAudio) {
                    window.RakazaAudio.sfx(kind, game ? game.combo : 0);
                    if (window.RakazaFeel) window.RakazaFeel.vib(kind);
                    return;
                }
                if (kind === 'jump') {
                    tone(250, 0.13, 'triangle', 0.055, 0, 690);
                } else if (kind === 'coin') {
                    const pitch = 700 + Math.min(game ? game.combo : 0, 20) * 36;
                    tone(pitch, 0.13, 'sine', 0.045);
                } else if (kind === 'hit') {
                    tone(120, 0.22, 'sawtooth', 0.05, 0, 30);
                } else if (kind === 'power') {
                    [440, 554, 660, 880].forEach((n, i) => tone(n, 0.17, 'triangle', 0.04, i * 0.055));
                }
            }

            function updateAudio(dt) {
                if (window.RakazaAudio) { window.RakazaAudio.music(dt, state, game); return; }
                if (state !== 'play' || saved.mute) {
                    return;
                }
                musicClock -= dt;
                if (musicClock <= 0) {
                    musicClock += 0.28;
                    const notes = game && game.dist >= 1800
                        ? [220, 261.63, 329.63, 440, 329.63, 261.63, 196, 293.66]
                        : [220, 277.18, 329.63, 440, 329.63, 277.18, 246.94, 369.99];
                    tone(notes[musicStep++ % notes.length], 0.21, 'sine', 0.012);
                }
            }

            // v15: the simulation lives in rakaza-sim.js (pure, fixed 120 Hz, deterministic, replayable).
            // These wrappers keep the legacy call shapes the trainer / pilot / extras still use.
            const Sim = window.RakazaSim, RC = window.RakazaContent, OPS = Sim.OPS;
            const FX = window.RakazaFX, ART = window.RakazaArt;
            const TICK = Sim.DT;
            const defaultGenome = [0.32, 0.30, 0.88, 0.15];
            const reduced = () => !!(saved.low || (window.RakazaPrefs && window.RakazaPrefs.get('reduceMotion')));
            const prefReduced = () => !!(window.RakazaPrefs && window.RakazaPrefs.get('reduceMotion'));

            function createWorld(seed, cfg) {
                return Sim.create(seed, cfg || {});
            }

            function fillWorld(w) {
                Sim.fillWorld(w);
            }

            function triggerJump(w, power, doubleOnly) {
                return Sim.input(w, doubleOnly ? OPS.DOUBLE : OPS.JUMP, Math.round(clamp(power || 0, 0, 1) * 4));
            }

            function triggerSlide(w) {
                return Sim.input(w, OPS.SLIDE, 0);
            }

            function stepWorld(w, dt) {
                const n = Math.max(1, Math.round(dt / TICK));
                for (let i = 0; i < n && !w.dead && !w.paused; i++) {
                    Sim.step(w);
                }
            }

            function decide(w, genes, safety, override) {
                return Sim.decide(w, genes || defaultGenome, safety, override);
            }

            function applyDecision(w, decision) {
                Sim.applyDecision(w, decision);
            }

            // sim events -> sound, juice, meta (banners, XP, draft UI)
            const SFX_OF = { jump: 'jump', coin: 'coin', near: 'near', power: 'power', stomp: 'stomp', land: 'land', slide: 'slide', skill: 'skill', gem: 'gem', star: 'star', bolt: 'bolt', heart: 'heart', bossDown: 'bossdown', zone: 'event', stage: 'stage', revive: 'revive', draft: 'draft', ladder: 'stage' };

            function drainEvents(w) {
                const evs = w.ev;
                if (!evs || !evs.length) {
                    return;
                }
                w.ev = [];
                for (const e of evs) {
                    if (e[0] === 'hit') {
                        sound(e[3] === 1 ? 'hit' : 'hurt');
                    } else if (SFX_OF[e[0]]) {
                        sound(SFX_OF[e[0]]);
                    }
                }
                const info = FX.onEvents(w, evs, {});
                if (info && info.split) {
                    split = Math.max(split, info.split);
                }
                hitStop = Math.max(hitStop, FX.takeHitstop());
                if (H.onSimEvents) {
                    H.onSimEvents(w, evs);
                }
            }

            let pilotClock = 0;
            let pilotInfo = { action: 'WAIT', reason: 'Reading the roof ahead.', source: 'built-in pilot' };

            function brain() {
                return window.RakazaBrain || null;
            }

            function abortPilot() {
                const b = brain();
                if (b && b.abort) {
                    b.abort();
                }
            }

            // the brain (River / BYO) is polled here; decisions are applied per sim tick in frame()
            function updatePilot(dt) {
                if (!aiEnabled || !game || game.paused || championMode) {
                    return;
                }
                const b = brain();
                if (b && b.tick) {
                    b.tick(game, dt);
                }
            }

            function pilotDecision(w) {
                const b = brain();
                const genes = championMode && saved.champion ? saved.champion : defaultGenome;
                const override = !championMode && b && b.override ? b.override(w) : null;
                return decide(w, genes, !championMode, override);
            }

            function pilotSource(decision) {
                if (championMode) {
                    return 'champion · local genome';
                }
                const b = brain();
                if (decision && decision.src === 'river' && b && b.srcLabel) {

            let lastResultOpts = null;

                const chips = [];

            const trainer = {
                running: false,
                generation: 0,
                elapsed: 0,
                accumulator: 0,
                population: [],
                worlds: [],
                history: [],
                bestFitness: -Infinity,
                champion: saved.champion ? saved.champion.slice() : null,
                random: seeded(47291)
            };

            function randomGenome() {
                return [
                    0.07 + trainer.random() * 0.58,
                    0.06 + trainer.random() * 0.60,
                    trainer.random(),
                    trainer.random()
                ];
            }

            function initializePopulation() {
                trainer.population = Array.from({ length: 24 }, randomGenome);
                if (trainer.champion) {
                    trainer.population[0] = trainer.champion.slice();
                }
                prepareGeneration();
            }

            function prepareGeneration() {
                trainer.elapsed = 0;
                trainer.accumulator = 0;
                trainer.worlds = trainer.population.map(() => {
                    const w = createWorld(86421, { trainer: true });
                    fillWorld(w);
                    return w;
                });
            }

            function finishGeneration() {
                const ranked = trainer.worlds.map((w, i) => ({
                    genes: trainer.population[i].slice(),
                    fitness: w.dist + w.coins * 2 - w.collisions * 50,
                    distance: w.dist
                })).sort((a, b) => b.fitness - a.fitness);
                trainer.generation++;
                const mean = ranked.reduce((sum, entry) => sum + entry.fitness, 0) / ranked.length;

                if (ranked[0].fitness > trainer.bestFitness) {
                    trainer.bestFitness = ranked[0].fitness;
                    trainer.champion = ranked[0].genes.slice();
                    saved.champion = trainer.champion.slice();
                    persist();
                }

                trainer.history.push({
                    generation: trainer.generation,
                    best: trainer.bestFitness,
                    mean,
                    distance: ranked[0].distance
                });

                if (trainer.generation >= 30) {
                    trainer.running = false;
                    trainer.elapsed = 45;
                    toast('GENERATION 30 · CHAMPION SAVED');
                } else {
                    const survivors = ranked.slice(0, 6).map((entry) => entry.genes.slice());
                    const next = survivors.map((genes) => genes.slice());
                    while (next.length < 24) {
                        const a = survivors[Math.floor(trainer.random() * 6)];
                        const b = survivors[Math.floor(trainer.random() * 6)];
                        const child = a.map((gene, i) => {
                            let value = trainer.random() < 0.5 ? gene : b[i];
                            if (trainer.random() < 0.08) {
                                value += (trainer.random() - 0.5) * (i < 2 ? 0.30 : 0.65);
                            }
                            return clamp(value, i < 2 ? 0.06 : 0, i < 2 ? 0.7 : 1);
                        });
                        next.push(child);
                    }
                    trainer.population = next;
                    prepareGeneration();
                }
                if (state === 'trainer') {
                    refreshTrainerTable();
                }
            }

            function simulateTrainer(dt) {
                if (!trainer.running || state !== 'trainer') {
                    return;
                }
                trainer.accumulator += dt * 20;
                let steps = 0;
                while (trainer.accumulator >= 1 / 60 && trainer.running && steps < 180) {
                    trainer.accumulator -= 1 / 60;
                    trainer.elapsed += 1 / 60;
                    for (let i = 0; i < trainer.worlds.length; i++) {
                        const w = trainer.worlds[i];
                        if (!w.dead) {
                            applyDecision(w, decide(w, trainer.population[i]));
                            stepWorld(w, 1 / 60);
                        }
                    }
                    steps++;
                    if (trainer.elapsed >= 45) {
                        finishGeneration();
                    }
                }
            }

            function showTrainer() {
                showMenu('trainer', `
                    <header>
                        <div class="brand">EVOLUTION LAB</div>
                        <h2>Teach instinct.</h2>
                        <p class="subtitle">24 runners · 45s trials · 20× simulation<br>6 elites · uniform crossover · 8% mutation · 30 generations</p>
                    </header>
                    <div class="card">
                        <div class="trainer-topline">

                            <span id="trainer-state" class="cyan">READY</span>
                        </div>

                    </div>
                    <div class="card">
                        <table>
                            <thead><tr><th>GEN</th><th>BEST</th><th>MEAN</th><th>METRES</th></tr></thead>
                            <tbody id="generation-table"></tbody>
                        </table>
