                    </div>
                    <div class="menu-grid">
                        <button class="primary" id="train-button">TRAIN</button>
                        <button id="train-pause">PAUSE</button>
                        <button class="purple" id="watch-button">WATCH CHAMPION</button>
                        <button id="reset-button">RESET</button>
                        <button class="wide" id="trainer-back">BACK</button>
                    </div>
                `);

                $('train-button').onclick = () => {
                    if (trainer.generation >= 30) {
                        toast('Training complete. Watch your champion or reset.');
                        return;
                    }
                    if (!trainer.population.length) {
                        initializePopulation();
                    }
                    trainer.running = true;
                    unlockAudio();
                    refreshTrainerTable();
                };

                $('train-pause').onclick = () => {
                    if (trainer.population.length && trainer.generation < 30) {
                        trainer.running = !trainer.running;
                    }
                    refreshTrainerTable();
                };

                $('watch-button').onclick = () => {
                    if (saved.champion) {
                        trainer.running = false;
                        startGame('champion');
                    } else {
                        toast('Finish one generation to save a champion.');
                    }
                };

                $('reset-button').onclick = () => {
                    trainer.running = false;
                    trainer.generation = 0;
                    trainer.elapsed = 0;
                    trainer.accumulator = 0;
                    trainer.population = [];
                    trainer.worlds = [];
                    trainer.history = [];
                    trainer.bestFitness = -Infinity;
                    trainer.champion = null;
                    trainer.random = seeded(47291);
                    saved.champion = null;
                    persist();
                    refreshTrainerTable();
                };

                $('trainer-back').onclick = () => {
                    trainer.running = false;
                    title();
                };
                refreshTrainerTable();
            }

            function refreshTrainerTable() {
                if (state !== 'trainer') {
                    return;
                }
                const rows = trainer.history.slice(-5);
                $('generation-table').innerHTML = rows.length
                    ? rows.map((row) => `<tr><td>${String(row.generation).padStart(2, '0')}</td><td class="gold">${Math.round(row.best)}</td><td>${Math.round(row.mean)}</td><td>${Math.round(row.distance)}m</td></tr>`).join('')
                    : '<tr><td colspan="4" style="text-align:left;padding:12px 3px">No trials yet. Start a population.</td></tr>';
                const g = trainer.champion;
                $('genome-label').textContent = g
                    ? 'CHAMPION  lead ' + g[0].toFixed(3) + ' / slide ' + g[1].toFixed(3) + ' / double ' + g[2].toFixed(3) + ' / greed ' + g[3].toFixed(3) + '  ·  fitness = m + coins×2 − hits×50'
                    : 'Same runner physics, collisions and pickups. Fitness = metres + coins×2 − collisions×50.';
                $('train-button').textContent = trainer.generation >= 30 ? 'COMPLETE' : trainer.population.length ? 'RESUME TRAINING' : 'TRAIN';
                $('train-pause').textContent = trainer.running ? 'PAUSE' : 'RESUME';
            }

            function drawCurve() {
                const curve = $('curve');
                if (!curve) {
                    return;
                }
                const cw = Math.max(1, curve.clientWidth);
                const ch = Math.max(1, curve.clientHeight);
                if (curve.width !== Math.round(cw * dpr) || curve.height !== Math.round(ch * dpr)) {
                    curve.width = Math.round(cw * dpr);
                    curve.height = Math.round(ch * dpr);
                }
                const g = curve.getContext('2d');
                g.setTransform(dpr, 0, 0, dpr, 0, 0);
                g.clearRect(0, 0, cw, ch);
                const left = 30;
                const bottom = ch - 15;
                const max = Math.max(100, ...trainer.history.map((r) => r.best)) * 1.1;

                g.font = '8px system-ui';
                for (let i = 0; i <= 3; i++) {
                    const y = 8 + (bottom - 8) * i / 3;
                    g.strokeStyle = '#ffffff10';
                    g.beginPath();
                    g.moveTo(left, y);
                    g.lineTo(cw - 4, y);
                    g.stroke();
                    g.fillStyle = '#716b80';
                    g.fillText(Math.round(max * (1 - i / 3)).toString(), 0, y + 3);
                }

                for (const [key, color] of [['mean', '#22d3ee'], ['best', '#d9b26a']]) {
                    g.strokeStyle = color;
                    g.lineWidth = 2;
                    g.beginPath();
                    trainer.history.forEach((row, i) => {
                        const x = left + (cw - left - 8) * i / 29;
                        const y = bottom - clamp(row[key] / max, 0, 1) * (bottom - 8);
                        if (i === 0) {
                            g.moveTo(x, y);
                        } else {
                            g.lineTo(x, y);
                        }
                    });
                    g.stroke();
                    if (trainer.history.length) {
                        const i = trainer.history.length - 1;
                        const row = trainer.history[i];
                        g.fillStyle = color;
                        g.beginPath();
                        g.arc(left + (cw - left - 8) * i / 29, bottom - clamp(row[key] / max, 0, 1) * (bottom - 8), 3, 0, Math.PI * 2);
                        g.fill();
                    }
                }
                g.fillStyle = '#716b80';
                g.fillText('01', left, ch - 2);
                g.fillText('30', cw - 16, ch - 2);
                if (!trainer.history.length) {
                    g.fillStyle = '#6e667d';
                    g.fillText('LIVE FITNESS / NO SYNTHETIC DATA', left + 10, ch / 2);
                }

                $('trainer-generation').textContent = 'GEN ' + String(Math.min(30, trainer.generation + 1)).padStart(2, '0') + ' / 30';
                $('trainer-state').textContent = trainer.generation >= 30 ? 'COMPLETE' : trainer.running ? 'SIMULATING · 20×' : 'PAUSED';
                $('progress-fill').style.width = (trainer.elapsed / 45 * 100) + '%';
            }

            function colorMix(a, b, t) {
                const r = Math.round(lerp(a[0], b[0], t));
                const g = Math.round(lerp(a[1], b[1], t));
                const blue = Math.round(lerp(a[2], b[2], t));
                return `rgb(${r},${g},${blue})`;
            }

            function rounded(g, x, y, w, h, radius) {
                const r = Math.max(0, Math.min(radius, w / 2, h / 2));
                g.beginPath();
                g.moveTo(x + r, y);
                g.arcTo(x + w, y, x + w, y + h, r);
                g.arcTo(x + w, y + h, x, y + h, r);
                g.arcTo(x, y + h, x, y, r);
                g.arcTo(x, y, x + w, y, r);
                g.closePath();
            }

            function drawCat(g, x, y, scale, skin, time, sliding = false, airborne = false, alpha = 1, silhouette = '', forceChar = '') {
                const who = forceChar || (window.RakazaPrefs ? window.RakazaPrefs.get('char') : 'cat');
                if (who !== 'cat' && window.RakazaChar) {
                    window.RakazaChar.draw(g, x, y, scale, skin, time, sliding, airborne, alpha, silhouette, window.RakazaPrefs ? window.RakazaPrefs.get('outfit') : 0, saved.low);
                    return;
                }
                g.save();
                g.translate(x, y);
                g.scale(scale, scale);
                g.globalAlpha *= alpha;
                const run = Math.sin(time * 19);
                const bob = airborne ? -1 : Math.sin(time * 38) * 1.1;
                g.translate(0, bob);
                const body = silhouette || skin.body;
                const dark = silhouette || skin.dark;

                g.strokeStyle = silhouette || skin.scarf;
                g.lineWidth = 7;
                g.lineCap = 'round';
                g.beginPath();
                g.moveTo(-8, sliding ? -14 : -31);
                g.bezierCurveTo(-25, -30, -33, -17 + Math.sin(time * 12) * 6, -53, -30 + Math.sin(time * 11) * 9);
                g.stroke();

                g.strokeStyle = dark;
                g.lineWidth = 6;
                g.beginPath();
                g.moveTo(-11, sliding ? -9 : -15);
                g.bezierCurveTo(-25, -12, -34, -7, -32, -22);
                g.stroke();

                if (sliding) {
                    g.fillStyle = body;
                    rounded(g, -19, -21, 37, 17, 8);
                    g.fill();
                    g.fillStyle = dark;
                    rounded(g, -20, -7, 40, 7, 3);
                    g.fill();
                    g.translate(9, 20);
                } else {
                    g.strokeStyle = dark;
                    g.lineWidth = 8;
                    g.beginPath();
                    g.moveTo(-5, -14);
                    g.lineTo(-9 + (airborne ? -6 : run * 11), -3);
                    g.moveTo(5, -14);
                    g.lineTo(8 + (airborne ? 5 : -run * 11), -2);
                    g.stroke();
                    g.fillStyle = body;
                    rounded(g, -12, -34, 24, 25, 9);
                    g.fill();
                    g.strokeStyle = dark;
                    g.lineWidth = 6;
                    g.beginPath();
                    g.moveTo(7, -28);
                    g.lineTo(15 + run * 4, -18);
                    g.stroke();
                }

                g.fillStyle = body;
                g.beginPath();
                g.moveTo(-13, -39);
                g.lineTo(-13, -55);
                g.lineTo(-3, -48);
                g.lineTo(8, -49);
                g.lineTo(16, -57);
                g.lineTo(18, -36);
                g.closePath();
                g.fill();
                rounded(g, -14, -48, 34, 25, 10);
                g.fill();

                if (!silhouette) {
                    g.fillStyle = '#17162a';
                    rounded(g, -6, -44, 28, 12, 5);
                    g.fill();
                    g.shadowColor = '#22d3ee';
                    g.shadowBlur = saved.low ? 0 : 11;
                    g.fillStyle = '#22d3ee';
                    rounded(g, -3, -41, 25, 6, 3);
                    g.fill();
                    g.shadowBlur = 0;
                    g.fillStyle = '#d9fbff';
                    g.fillRect(11, -40, 6, 2);
                    g.fillStyle = skin.scarf;
                    rounded(g, -11, -27, 25, 5, 2);
                    g.fill();
                    g.fillStyle = '#ffffff40';
                    g.fillRect(-9, -47, 5, 2);
                }
                g.restore();
            }
            if (window.RakazaChar) window.RakazaChar.drawCat = (g, x, y, s, t) => drawCat(g, x, y, s, skins[saved.skin], t, false, false, 1, "", "cat");

            function drawBackground(travel, dist, theme) {
                const P = ART.palAt(dist, theme);
                const night = P.night;
                const sky = ctx.createLinearGradient(0, 0, 0, groundY);
                sky.addColorStop(0, P.skyTop);
                sky.addColorStop(1, P.skyLow);
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, width, height);

                if (night > 0.04) {
                    ctx.globalAlpha = Math.min(1, night * 1.2);
                    const count = saved.low ? 36 : 80;
                    for (let i = 0; i < count; i++) {
                        const x = hash(i + 3) * width;
                        const y = hash(i + 203) * groundY * 0.72;
                        const tw = 0.55 + 0.45 * Math.sin(visualTime * (1 + hash(i) * 2) + i);
                        ctx.fillStyle = `rgba(219,229,255,${(0.2 + hash(i) * 0.6) * tw})`;
                        ctx.fillRect(x, y, hash(i + 51) > 0.9 ? 2 : 1, 1.5);
                    }
                    ctx.fillStyle = '#cce3ff';
                    ctx.beginPath();
                    ctx.arc(width * 0.78, height * 0.25, 21 * unit, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = P.skyTop;
                    ctx.beginPath();
                    ctx.arc(width * 0.78 - 8 * unit, height * 0.25 - 5 * unit, 20 * unit, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                if (P.sunA > 0.03) {
                    const sx = width * 0.77;
                    const sy = groundY * 0.58;
                    const radius = 53 * unit;
                    ctx.globalAlpha = P.sunA;
                    if (!saved.low) {
                        const glow = ctx.createRadialGradient(sx, sy, radius * 0.15, sx, sy, radius * 2.8);
                        glow.addColorStop(0, ART.css(P.sun, 0.38));
                        glow.addColorStop(1, ART.css(P.sun, 0));
                        ctx.fillStyle = glow;
                        ctx.fillRect(sx - radius * 3, sy - radius * 3, radius * 6, radius * 6);
                    }
                    ctx.fillStyle = ART.css(P.sun);
                    ctx.beginPath();
                    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                // deeper parallax: haze skyline -> far -> near
                ctx.globalAlpha = 0.45;
                drawCityLayer(travel, 0.05, 120, groundY - 70 * unit, 190, P.far, night, false);
                ctx.globalAlpha = 1;
                drawCityLayer(travel, 0.12, 86, groundY - 43 * unit, 130, P.far, night, false);
                drawCityLayer(travel, 0.29, 72, groundY + 5 * unit, 190, P.near, night, true);

                ctx.fillStyle = P.ground;
                ctx.fillRect(0, groundY, width, height - groundY);
                return night;
            }

            function drawCityLayer(travel, parallax, spacing, base, maxHeight, color, night, lit) {
                const offset = travel * parallax;
                const start = Math.floor(offset / spacing) - 2;
                const count = Math.ceil(width / unit / spacing) + 5;
                for (let j = start; j < start + count; j++) {
                    const h = (35 + hash(j + 110) * maxHeight) * unit;
                    const bw = (spacing - 7 + hash(j + 81) * 9) * unit;
                    const x = (j * spacing - offset) * unit;
                    const y = base - h;
                    ctx.fillStyle = color;
                    ctx.fillRect(x, y, bw, h);
                    ctx.fillRect(x + bw * 0.32, y - 8 * unit, bw * 0.35, 10 * unit);
                    if (hash(j + 24) > 0.65) {
                        ctx.fillRect(x + bw * 0.55, y - 32 * unit, 2 * unit, 33 * unit);
                        ctx.fillStyle = night > 0.5 ? ART.P.accent : '#d49ba6';
                        ctx.fillRect(x + bw * 0.55, y - 33 * unit, 2 * unit, 2 * unit);
                    }
                    if (lit) {
                        for (let row = 0; row < Math.floor(h / (17 * unit)) - 1; row++) {
                            for (let col = 0; col < 4; col++) {
                                if (hash(j * 91 + row * 13 + col) > 0.41) {
                                    ctx.fillStyle = hash(j + col) > 0.7
                                        ? ART.css(ART.P.win[0], 0.12 + night * 0.45)
                                        : ART.css(ART.P.win[1], 0.15 + night * 0.48);
                                    ctx.fillRect(x + 10 * unit + col * 12 * unit, y + 13 * unit + row * 17 * unit, 4 * unit, 7 * unit);
                                }
                            }
                        }
                        if (night > 0.1 && hash(j + 8) > 0.67) {
                            ctx.globalAlpha = night;
                            ctx.fillStyle = j % 2 ? ART.P.accent : ART.css(ART.P.win[0]);
                            const sy = y + 35 * unit;
                            ctx.fillRect(x + bw - 12 * unit, sy, 9 * unit, 40 * unit);
                            ctx.fillStyle = '#171828';
                            for (let k = 0; k < 4; k++) {
                                ctx.fillRect(x + bw - 10 * unit, sy + (5 + k * 8) * unit, 5 * unit, 3 * unit);
                            }
                            ctx.globalAlpha = 1;
                        }
                    }
                }
            }

            function worldX(x, travel) {
                return playerX + (x - travel) * unit;
            }

            function roofSection(x1, x2, travel, night) {
                if (x2 <= x1) {
                    return;
                }
                ctx.fillStyle = ART.P.ground;
                ctx.fillRect(x1, groundY, x2 - x1, height - groundY);
                ctx.fillStyle = ART.P.near;
                ctx.fillRect(x1, groundY, x2 - x1, 10 * unit);
                ctx.fillStyle = ART.P.edge;
                ctx.fillRect(x1, groundY, x2 - x1, 2 * unit);
                ctx.fillStyle = '#0b0f18';
                ctx.fillRect(x1, groundY + 14 * unit, x2 - x1, 5 * unit);

                ctx.save();
                ctx.beginPath();
                ctx.rect(x1, groundY + 19 * unit, x2 - x1, height - groundY);
                ctx.clip();
                const offset = (travel * unit) % (68 * unit);
                for (let x = -offset; x < width + 68 * unit; x += 68 * unit) {
                    ctx.fillStyle = '#10121d';
                    ctx.fillRect(x + 14 * unit, groundY + 35 * unit, 30 * unit, 47 * unit);
                    ctx.fillStyle = night > 0.4 ? '#d9b26a27' : '#61536b44';
                    ctx.fillRect(x + 17 * unit, groundY + 38 * unit, 11 * unit, 41 * unit);
                    ctx.fillRect(x + 31 * unit, groundY + 38 * unit, 10 * unit, 41 * unit);
                    ctx.fillStyle = '#ffffff05';
                    ctx.fillRect(x, groundY + 105 * unit, 60 * unit, 1);
                }
                ctx.restore();
                if (night > 0 && !saved.low) {
                    ctx.globalAlpha = night * 0.4;
                    ctx.fillStyle = ART.P.accent;
                    const step = 110 * unit;
                    for (let x = x1 + 12 * unit; x < x2; x += step) {
                        ctx.fillRect(x, groundY + 5 * unit, Math.min(36 * unit, x2 - x), unit);
                    }
                    ctx.globalAlpha = 1;
                }
            }

            function drawRoofs(w, travel, night) {
                const gaps = w ? w.obstacles.filter((o) => o.kind === 'gap').sort((a, b) => a.x - b.x) : [];
                let left = 0;
                for (const gap of gaps) {
                    const start = worldX(gap.x - gap.width / 2, travel);
                    const end = worldX(gap.x + gap.width / 2, travel);
                    if (end < 0 || start > width) {
                        continue;
                    }
                    roofSection(left, Math.max(left, start), travel, night);
                    ctx.fillStyle = '#090b15';
                    ctx.fillRect(start, groundY + 8 * unit, 5 * unit, height - groundY);
                    ctx.fillRect(end - 5 * unit, groundY + 8 * unit, 5 * unit, height - groundY);
                    left = Math.max(left, end);
                }
                roofSection(left, width, travel, night);
            }

            function drawObstacle(o, travel) {
                const x = worldX(o.x, travel);
                if (x < -100 * unit || x > width + 110 * unit || o.kind === 'gap' || o.dead) {
                    return;
                }
                ctx.save();
                ctx.translate(x, groundY);
                ctx.scale(unit, unit);
                if (o.hit) {
                    ctx.globalAlpha = 0.35;
                }
                const half = o.width / 2;
                ctx.fillStyle = '#0a0c1390';
                ctx.beginPath();
                ctx.ellipse(3, 2, half + 7, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                if (ART.drawObstacle(ctx, o, game, visualTime, saved.low)) {
                    ctx.restore();
                    return;
                }

                if (o.kind === 'vent' || o.kind === 'ac') {
                    ctx.fillStyle = '#4b4b63';
                    rounded(ctx, -half, -o.top, o.width, o.top, 4);
                    ctx.fill();
                    ctx.fillStyle = '#717088';
                    ctx.fillRect(-half - 3, -o.top, o.width + 6, 5);
                    ctx.fillStyle = '#222534';
                    if (o.kind === 'ac') {
                        ctx.beginPath();
                        ctx.arc(0, -20, 13, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#818097';
                        ctx.lineWidth = 2;
                        for (let i = 0; i < 3; i++) {
                            const a = visualTime * 5 + i * Math.PI * 2 / 3;
                            ctx.beginPath();
                            ctx.moveTo(0, -20);
                            ctx.lineTo(Math.cos(a) * 10, -20 + Math.sin(a) * 10);
                            ctx.stroke();
                        }
                    } else {
                        for (let i = 0; i < 4; i++) {
                            ctx.fillRect(-half + 6, -o.top + 10 + i * 5, o.width - 12, 2);
                        }
                    }
                    ctx.fillStyle = '#d9b26a';
                    ctx.fillRect(half - 9, -9, 4, 3);
                } else if (o.kind === 'tank') {
                    ctx.fillStyle = '#302e45';
                    ctx.fillRect(-18, -23, 5, 23);
                    ctx.fillRect(13, -23, 5, 23);
                    ctx.fillStyle = '#65516b';
                    rounded(ctx, -half, -58, o.width, 43, 7);
                    ctx.fill();
                    ctx.fillStyle = '#8c7089';
                    ctx.beginPath();
                    ctx.ellipse(0, -58, half, 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#342c46';
                    ctx.fillRect(-half, -46, o.width, 3);
                    ctx.fillRect(-half, -25, o.width, 3);
                    ctx.fillStyle = '#bc96995a';
                    ctx.fillRect(-half + 7, -53, 4, 33);
                } else if (o.kind === 'sign') {
                    ctx.fillStyle = '#4b405e';
                    ctx.fillRect(-half + 3, -91, 3, 59);
                    ctx.fillRect(half - 6, -91, 3, 59);
                    ctx.fillStyle = '#171125';
                    rounded(ctx, -half, -79, o.width, 47, 5);
                    ctx.fill();
                    ctx.strokeStyle = '#ed55ba';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#f43f9e';
                    ctx.shadowBlur = saved.low ? 0 : 13;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ff87d8';
                    ctx.font = 'bold 14px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('LOW', 0, -52);
                    ctx.fillStyle = '#22d3ee';
                    ctx.fillRect(-20, -43, 40, 2);
                } else if (o.kind === 'laser') {
                    ctx.fillStyle = '#3a1b2a';
                    ctx.fillRect(-half + 2, -103, 3, 70);
                    ctx.fillRect(half - 5, -103, 3, 70);
                    ctx.fillStyle = '#170d16';
                    rounded(ctx, -half, -o.top, o.width, 26, 4);
                    ctx.fill();
                    ctx.strokeStyle = '#f43f5e';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#f43f5e';
                    ctx.shadowBlur = saved.low ? 0 : 16;
                    ctx.beginPath();
                    ctx.moveTo(-half, -o.top + 13);
                    ctx.lineTo(half, -o.top + 13);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ff9db0';
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('LASER', 0, -o.top + 8);
                } else if (o.kind === 'stack') {
                    ctx.fillStyle = '#4b4b63';
                    rounded(ctx, -half, -o.top, o.width, 44, 4);
                    ctx.fill();
                    ctx.fillStyle = '#5c5c78';
                    rounded(ctx, -half + 6, -o.top + 46, o.width - 12, 40, 4);
                    ctx.fill();
                    ctx.fillStyle = '#717088';
                    ctx.fillRect(-half - 3, -o.top, o.width + 6, 5);
                    ctx.fillRect(-half + 3, -o.top + 46, o.width, 4);
                    ctx.fillStyle = '#222534';
                    for (let i = 0; i < 3; i++) {
                        ctx.fillRect(-half + 8, -o.top + 14 + i * 8, o.width - 16, 3);
                        ctx.fillRect(-half + 13, -o.top + 60 + i * 8, o.width - 26, 3);
                    }
                } else if (o.kind === 'critter' || o.kind === 'brute') {
                    const big = o.kind === 'brute';
                    const body = big ? 30 : 20;
                    const bob = Math.sin(visualTime * 6 + o.seed * 9) * (big ? 2 : 3);
                    ctx.fillStyle = big ? '#5b3a6e' : '#3f5d54';
                    ctx.beginPath();
                    ctx.ellipse(0, -body / 2 + bob, body * 0.9, body * 0.62, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = big ? '#7d51a0' : '#5b8a76';
                    ctx.beginPath();
                    ctx.arc(body * 0.5, -body * 0.9 + bob, body * 0.38, 0, Math.PI * 2);
                    ctx.fill();
                    // eyes
                    ctx.fillStyle = '#ff5d8f';
                    ctx.shadowColor = '#ff5d8f';
                    ctx.shadowBlur = saved.low ? 0 : 10;
                    ctx.beginPath();
                    ctx.arc(body * 0.62, -body * 0.95 + bob, 2.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // legs
                    ctx.strokeStyle = big ? '#43294f' : '#2f4a41';
                    ctx.lineWidth = big ? 5 : 3;
                    for (let i = -1; i <= 1; i += 2) {
                        const sw = Math.sin(visualTime * 9 + i * 1.6 + o.seed * 5) * 5;
                        ctx.beginPath();
                        ctx.moveTo(i * body * 0.4, -2 + bob);
                        ctx.lineTo(i * body * 0.4 + sw, 0);
                        ctx.stroke();
                    }
                    // teeth
                    ctx.fillStyle = '#f6e7c1';
                    ctx.fillRect(body * 0.45, -body * 0.72 + bob, 3, 4);
                } else if (o.kind === 'bat') {
                    const flap = Math.sin(visualTime * 14 + o.seed * 8);
                    ctx.fillStyle = '#2b2140';
                    ctx.beginPath();
                    ctx.ellipse(0, -46, 12, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(-6, -48); ctx.lineTo(-26, -48 - flap * 10); ctx.lineTo(-8, -40); ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(6, -48); ctx.lineTo(26, -48 - flap * 10); ctx.lineTo(8, -40); ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#ffd166';
                    ctx.beginPath(); ctx.arc(-3, -48, 1.8, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(3, -48, 1.8, 0, Math.PI * 2); ctx.fill();
                } else if (o.kind === 'dish') {
                    ctx.strokeStyle = '#68637e';
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(-3, 0);
                    ctx.lineTo(4, -30);
                    ctx.stroke();
                    ctx.fillStyle = '#91849f';
                    ctx.beginPath();
                    ctx.ellipse(0, -34, 21, 11, -0.55, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#c4aac4';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, -34);
                    ctx.lineTo(15, -48);
                    ctx.stroke();
                    ctx.fillStyle = '#22d3ee';
                    ctx.fillRect(12, -49, 5, 4);
                } else if (o.kind === 'drone') {
                    ctx.strokeStyle = '#7b6d97';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-22, -58);
                    ctx.lineTo(22, -58);
                    ctx.stroke();
                    ctx.fillStyle = '#40354f';
                    rounded(ctx, -17, -58, 34, 22, 8);
                    ctx.fill();
                    ctx.fillStyle = '#f43f5e';
                    ctx.shadowColor = '#f43f5e';
                    ctx.shadowBlur = saved.low ? 0 : 10;
                    ctx.fillRect(-10, -48, 20, 4);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#a69abb';
                    ctx.lineWidth = 2;
                    const rotor = 7 + Math.sin(visualTime * 70) * 3;
                    [-22, 22].forEach((rx) => {
                        ctx.beginPath();
                        ctx.ellipse(rx, -63, rotor, 2, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    });
                } else if (o.kind === 'pigeons') {
                    for (let i = 0; i < 3; i++) {
                        const px = -16 + i * 16;
                        const bob = Math.sin(visualTime * 6 + i) * 1.5;
                        ctx.fillStyle = i === 1 ? '#8a8197' : '#6e6c84';
                        ctx.beginPath();
                        ctx.ellipse(px, -9 + bob, 9, 7, -0.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(px + 5, -18 + bob, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#e5bd77';
                        ctx.fillRect(px + 8, -18 + bob, 4, 2);
                        ctx.fillRect(px - 3, -3, 2, 4);
                        ctx.fillRect(px + 3, -3, 2, 4);
                    }
                }
                ctx.restore();
            }

            function drawPickup(p, travel) {
                const x = worldX(p.x, travel);
                if (p.taken || x < -30 || x > width + 30) {
                    return;
                }
                const y = groundY - p.y * unit;
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(unit, unit);
                if (ART.NEW_PICKS[p.kind]) {
                    ART.drawPickup(ctx, p, visualTime);
                    ctx.restore();
                    return;
                }
                if (p.kind === 'coin') {
                    const spin = Math.abs(Math.cos(visualTime * 3 + p.x * 0.01));
                    ctx.scale(0.4 + spin * 0.6, 1);
                    ctx.fillStyle = '#e8b85e';
                    ctx.beginPath();
                    ctx.arc(0, 0, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff0b2';
                    ctx.lineWidth = 1.3;
                    ctx.beginPath();
                    ctx.arc(0, 0, 4.7, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = '#9e6c3a';
                    ctx.fillRect(-1, -3, 2, 6);
                } else {
                    const colors = {
                        shield: '#22d3ee',
                        magnet: '#f17bc8',
                        slow: '#a995ff',
                        double: '#efc975'
                    };
                    ctx.translate(0, Math.sin(visualTime * 4 + p.x) * 3);
                    ctx.shadowColor = colors[p.kind];
                    ctx.shadowBlur = saved.low ? 0 : 15;
                    ctx.fillStyle = '#141522';
                    ctx.strokeStyle = colors[p.kind];
                    ctx.lineWidth = 2;
                    rounded(ctx, -14, -14, 28, 28, 8);
                    ctx.fill();
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = colors[p.kind];
                    ctx.font = 'bold 14px system-ui';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const symbol = { shield: 'S', magnet: 'M', slow: 'T', double: '2×' };
                    ctx.fillText(symbol[p.kind], 0, 0);
                }
                ctx.restore();
            }

            function drawForeground(travel, night) {
                ctx.strokeStyle = '#080a14b0';
                ctx.lineWidth = 3 * unit;
                const cableOffset = (travel * 1.15) % 580;
                for (let i = -1; i < Math.ceil(width / (580 * unit)) + 2; i++) {
                    const x = (i * 580 - cableOffset) * unit;
                    const y = height * 0.89;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.bezierCurveTo(x + 140 * unit, y + 65 * unit, x + 400 * unit, y + 65 * unit, x + 580 * unit, y);
                    ctx.stroke();
                    ctx.fillStyle = '#0b0c17';
                    ctx.fillRect(x - 3 * unit, y - 12 * unit, 6 * unit, height - y + 12 * unit);
                }

            }

            function drawGame() {
                const runningWorld = game && ['play', 'pause', 'over'].includes(state) ? game : null;
                const travel = runningWorld ? runningWorld.travel : demoTravel;
                const dist = runningWorld ? runningWorld.dist : 100 + (demoTravel * 0.12 * 26) % 13200;
                const theme = runningWorld ? runningWorld.cfg.theme : -1;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.save();
                const cam = FX.camera(runningWorld, visualTime);
                if (cam) {
                    ctx.translate(width / 2 + cam.tx * unit, groundY + cam.ty * unit);
                    ctx.rotate(cam.rot);
                    ctx.scale(cam.zoom, cam.zoom);
                    ctx.translate(-width / 2, -groundY);
                }
                if (!reduced()) {
                    if (punch > 0) {
                        const zoom = 1 + Math.sin(punch / 0.5 * Math.PI) * 0.018;
                        ctx.translate(width / 2, groundY);
                        ctx.scale(zoom, zoom);
                        ctx.translate(-width / 2, -groundY);
                    }
                }

                const night = drawBackground(travel, dist, theme);
                drawRoofs(runningWorld, travel, night);

                if (runningWorld) {
                    for (const p of runningWorld.pickups) {
                        drawPickup(p, travel);
                    }
                    for (const o of runningWorld.obstacles) {
                        drawObstacle(o, travel);
                    }

                    if (!saved.low) {
                        for (const trail of trails) {
                            drawCat(ctx, worldX(trail.x, travel), groundY - trail.y * unit, unit, skins[saved.skin], trail.t, trail.slide, true, trail.life * 0.38, '#ed40a8');
                        }
                    }

                    if (H.onDraw && state === 'play') {
                        H.onDraw({ ctx, game: runningWorld, travel, worldX, groundY, unit, playerX, drawCat, skin: skins[saved.skin], visualTime });
                    }

                    if (!runningWorld.dead || runningWorld.y > -130) {
                        const py = groundY - runningWorld.y * unit;
                        const flicker = runningWorld.invulnerable > 0 && Math.floor(visualTime * 16) % 2 === 0;
                        ctx.fillStyle = '#00000045';
                        ctx.beginPath();
                        ctx.ellipse(playerX, groundY + 2 * unit, (20 - clamp(runningWorld.y / 12, 0, 10)) * unit, 4 * unit, 0, 0, Math.PI * 2);
                        ctx.fill();

                        if (!flicker) {
                            if (split > 0 && !saved.low) {
                                drawCat(ctx, playerX - 5 * unit, py, unit, skins[saved.skin], visualTime, runningWorld.slide > 0, !runningWorld.grounded, 0.45, '#22d3ee');
                                drawCat(ctx, playerX + 5 * unit, py, unit, skins[saved.skin], visualTime, runningWorld.slide > 0, !runningWorld.grounded, 0.45, '#f43f5e');
                            }
                            const sq = FX.squash(runningWorld);
                            ctx.save();
                            if (sq) {
                                ctx.translate(playerX, py);
                                ctx.scale(sq.sx, sq.sy);
                                ctx.translate(-playerX, -py);
                            }
                            if (runningWorld.ghostMode || runningWorld.blinkT > 0 || runningWorld.prismT > 0) {
                                ctx.globalAlpha = 0.72;
                            }
                            drawCat(ctx, playerX, py, unit, skins[saved.skin], visualTime, runningWorld.slide > 0, !runningWorld.grounded);
                            ctx.restore();
                        }

                        if (runningWorld.shield) {
                            ctx.strokeStyle = '#22d3ee88';
                            ctx.lineWidth = 1.5 * unit;
                            ctx.fillStyle = '#22d3ee0b';
                            ctx.beginPath();
                            ctx.ellipse(playerX, py - 25 * unit, 33 * unit, 39 * unit, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.stroke();
                        }
                        if (runningWorld.magnet > 0 && !saved.low) {
                            ctx.strokeStyle = '#f17bc833';
                            ctx.lineWidth = unit;
                            ctx.beginPath();
                            ctx.arc(playerX, py - 20 * unit, (48 + Math.sin(visualTime * 4) * 6) * unit, 0, Math.PI * 2);
                            ctx.stroke();
                        }
                    }
                    FX.drawWorld({ ctx, game: runningWorld, travel, worldX, groundY, unit, playerX, visualTime });
                } else {
                    drawCat(ctx, width * 0.79, groundY, unit * 1.35, skins[saved.skin], visualTime * 0.7, false, false);
                    FX.drawWorld({ ctx, game: null, travel, worldX, groundY, unit, playerX, visualTime });
                }

                if (!saved.low) {
                    for (const p of particles) {
                        ctx.globalAlpha = clamp(p.life / 0.3, 0, 1);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(worldX(p.x, travel), groundY - p.y * unit, p.size * unit, p.size * unit);
                    }
                    ctx.globalAlpha = 1;
                    if (dist > 1200) {
                        ctx.strokeStyle = '#d9d0ff20';
                        ctx.lineWidth = unit;
                        ctx.beginPath();
                        for (let i = 0; i < 13; i++) {
                            const x = ((hash(i + 7) * width - visualTime * 420) % (width + 100) + width + 100) % (width + 100);
                            const y = height * (0.29 + hash(i + 98) * 0.41);
                            ctx.moveTo(x, y);
                            ctx.lineTo(x + 24 + hash(i) * 30, y);
                        }
                        ctx.stroke();
                    }
                }

                drawForeground(travel, night);
                const vignette = ctx.createLinearGradient(0, 0, 0, height);
                vignette.addColorStop(0, '#08090b52');
                vignette.addColorStop(0.35, '#08090b00');
                vignette.addColorStop(0.8, '#08090b00');
                vignette.addColorStop(1, '#08090b85');
                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, width, height);
                ctx.restore();
                FX.drawOverlay(canvas, runningWorld, state === 'play', { pal: ART.P, weather: ART.P.weather, low: saved.low, reduced: prefReduced(), hide: document.body.classList.contains('rz-photo') });
            }

            function drawSkinPreviews() {
                panel.querySelectorAll('[data-preview]').forEach((preview) => {
                    const index = Number(preview.dataset.preview);
                    const w = preview.clientWidth;
                    const h = preview.clientHeight;
                    if (preview.width !== Math.round(w * dpr) || preview.height !== Math.round(h * dpr)) {
                        preview.width = Math.round(w * dpr);
                        preview.height = Math.round(h * dpr);
                    }
                    const g = preview.getContext('2d');
                    g.setTransform(dpr, 0, 0, dpr, 0, 0);
                    g.clearRect(0, 0, w, h);
                    g.fillStyle = skins[index].body + '15';
                    g.beginPath();
                    g.ellipse(w * 0.53, h * 0.82, 33, 5, 0, 0, Math.PI * 2);
                    g.fill();
                    const scale = Math.min(0.84, h / 68);
                    drawCat(g, w * 0.54, h - 3 + Math.sin(visualTime * 2 + index) * 1.5, scale, skins[index], visualTime * 0.3 + index);
                    if (saved.total < skins[index].cost) {
                        g.fillStyle = '#08090b55';
                        g.fillRect(0, 0, w, h);
                    }
                });
            }

            canvas.addEventListener('pointerdown', (event) => {
                if (state !== 'play') {
                    return;
                }
                unlockAudio();
                pointerOrigin = { x: event.clientX, y: event.clientY, id: event.pointerId };
                pointerHeld = true;
                if (!aiEnabled) {
                    pendingJump = true;
                }
                if (canvas.setPointerCapture) {
                    canvas.setPointerCapture(event.pointerId);
                }
            });

            canvas.addEventListener('pointermove', (event) => {
                if (!pointerOrigin || event.pointerId !== pointerOrigin.id || state !== 'play') {
                    return;
                }
                if (event.clientY - pointerOrigin.y > 34 && Math.abs(event.clientX - pointerOrigin.x) < 100) {
                    pendingSlide = true;
                    pendingJump = false;
                    pointerHeld = false;
                    if (game && game.y < 55 && game.vy > 0 && !aiEnabled) {
                        Sim.input(game, OPS.FASTFALL, 0);
                    }
                    pointerOrigin = null;
                }
            });

            function releasePointer() {
                pointerHeld = false;
                pointerOrigin = null;
            }

            canvas.addEventListener('pointerup', releasePointer);
            canvas.addEventListener('pointercancel', releasePointer);

            if (inputKit) {
                inputKit.on('a', () => {
                    if (state !== 'play') {
                        const button = menuButtons[menuIndex];
                        if (button && !button.disabled) {
                            unlockAudio();
                            button.click();
                        }
                    }
                });
            }

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (state === 'play') {
                        pauseGame();
                    }
                    if (state === 'trainer') {
                        trainer.running = false;
                        refreshTrainerTable();
                    }
                }
            });

            window.addEventListener('pagehide', () => {
                if (state === 'play') {
                    pauseGame();
                }
            });

            function updateMenuInput(input, dt) {
                if (!input || state === 'play') {
                    return;
                }
                const move = input.move || { x: 0, y: 0 };
                const value = Math.abs(move.y) > 0.5 ? move.y : Math.abs(move.x) > 0.5 ? move.x : 0;
                const direction = Math.sign(value);
                menuRepeat -= dt;
                if (direction !== 0 && (direction !== menuDirection || menuRepeat <= 0)) {
                    if (menuButtons.length) {
                        menuIndex = (menuIndex + direction + menuButtons.length) % menuButtons.length;
                        highlightMenu();
                    }
                    menuRepeat = direction !== menuDirection ? 0.35 : 0.16;
                }
                menuDirection = direction;
            }

            function updateEffects(dt) {
                hitStop = Math.max(0, hitStop - dt);
                shake = Math.max(0, shake - dt);
                split = Math.max(0, split - dt);
                punch = Math.max(0, punch - dt);
                if (toastTime > 0) {
                    toastTime -= dt;
                    if (toastTime <= 0) {
                        $('toast').style.opacity = '0';
                    }
                }

                FX.update(dt, state === 'play' && game ? game : null, state === 'play', { reduced: prefReduced(), low: saved.low, weather: ART.P.weather });
                if (state === 'play') {
                    for (const p of particles) {
                        p.life -= dt;
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        p.vy -= 250 * dt;
                    }
                    particles = particles.filter((p) => p.life > 0);
                    for (const trail of trails) {
                        trail.life -= dt;
                    }
                    trails = trails.filter((trail) => trail.life > 0);
                    if (!saved.low && game && !game.grounded) {
                        trailClock -= dt;
                        if (trailClock <= 0) {
                            trailClock = 0.055;
                            trails.push({
                                x: game.travel,
                                y: game.y,
                                slide: game.slide > 0,
                                t: visualTime,
                                life: 0.28
                            });
                        }
                    }
                }
            }

            let previousTime = performance.now();
            let physicsAccumulator = 0;

            function frame(now) {
                const dt = clamp((now - previousTime) / 1000, 0, 0.05);
                previousTime = now;
                visualTime += dt;
                const input = inputKit ? inputKit.read() : null;

                if (input && input.pressed && input.pressed.pause) {
                    if (state === 'play') {
                        pauseGame();
                    } else if (state === 'pause') {
                        resumeGame();
                    } else if (state === 'trainer' && trainer.population.length && trainer.generation < 30) {
                        trainer.running = !trainer.running;
                        refreshTrainerTable();
                    }
                }

                updateMenuInput(input, dt);
                updateEffects(dt);
                updateAudio(dt);
                if (H.onFrame) H.onFrame(game, state, dt, now);

                if (state === 'play' && game) {
                    const moveY = input && input.move ? input.move.y : 0;
                    const up = moveY < -0.5;
                    const down = moveY > 0.5;
                    if (!aiEnabled) {
                        if ((input && input.pressed && input.pressed.a) || (up && !axisUp)) {
                            pendingJump = true;
                        }
                        if ((input && input.pressed && input.pressed.b) || (down && !axisDown)) {
                            pendingSlide = true;
                        }
                        if (pendingJump) {
                            triggerJump(game, 0);
                        }
                        if (pendingSlide) {
                            triggerSlide(game);
                        }
                    }
                    axisUp = up;
                    axisDown = down;
                    pendingJump = false;
                    pendingSlide = false;

                    updatePilot(dt);
                    if (hitStop <= 0 && !game.paused && !game.dead) {
                        physicsAccumulator += dt;
                        let steps = 0;
                        while (physicsAccumulator >= TICK && steps < 8 && !game.dead && !game.paused) {
                            if (aiEnabled) {
                                const decision = pilotDecision(game);
                                applyDecision(game, decision);
                                if (decision.action !== 'WAIT') {
                                    pilotInfo = { ...decision, source: pilotSource(decision) };
                                }
                                if (game.tick % 6 === 0) {
                                    Sim.autoSkills(game);
                                }
                            }
                            const held = !aiEnabled && Boolean(pointerHeld || up || (input && input.a));
                            if (held !== game.held) {
                                Sim.input(game, held ? OPS.HOLD_ON : OPS.HOLD_OFF, 0);
                            }
                            Sim.step(game);
                            physicsAccumulator -= TICK;
                            steps++;
                        }
                        drainEvents(game);
                    } else {
                        physicsAccumulator = 0;
                        if (game.ev && game.ev.length) {
                            drainEvents(game);
                        }
                    }
                    if (game.dead) {
                        physicsAccumulator = 0;
                        if (game.deadAt == null) {
                            game.deadAt = visualTime;
                        }
                        if (visualTime - game.deadAt > (prefReduced() ? 0.05 : 0.7)) {
                            endGame();
                        }
                    }

                    const milestone = Math.floor(game.dist / 500);
                    if (milestone > lastMilestone && !game.dead) {
                        lastMilestone = milestone;
                        punch = reduced() ? 0 : 0.5;
                        toast(milestone * 500 + 'm · ' + ART.P.name);
                    }
                    hudClock -= dt;
                    if (hudClock <= 0) {
                        hudClock = 0.09;
                        updateHUD();
                    }
                } else {
                    physicsAccumulator = 0;
                    demoTravel += dt * 50;
                    axisUp = input && input.move ? input.move.y < -0.5 : false;
                    axisDown = input && input.move ? input.move.y > 0.5 : false;
                }

                simulateTrainer(dt);
                drawGame();

                if (state === 'skins') {
                    drawSkinPreviews();
                }
                if (state === 'char' && H.drawCharPreviews) {
                    H.drawCharPreviews(visualTime);
                }
                if (state === 'trainer') {
                    drawCurve();
                }

                requestAnimationFrame(frame);
            }

            window.__rz2 = {
                get game() { return game; },
                get combo() { return game ? game.combo : 0; },
                get kills() { return game ? (game.kills || 0) : 0; },
                get ai() { return !!aiEnabled; },
                get state() { return state; },
                decide, applyDecision, stepWorld, createWorld, fillWorld, defaultGenome, Sim, RC, FX, ART, drainEvents,
                get hitStop() { return hitStop; },
                saved, trainer, skins, clamp,
                setState(v) { state = v; }, showMenu, startGame, title, pauseGame, resumeGame, toast, sound, persist, drawCat, setupButtons, highlightMenu, panel, screen, hud,
                get lastMode() { return lastResultMode; },
                get lastOpts() { return lastResultOpts; },
                get dims() { return { width, height, unit, groundY, playerX, dpr }; }
            };
            title();
            requestAnimationFrame(frame);
        })();
    </script>
